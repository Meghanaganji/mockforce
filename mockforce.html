<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MockForce — Test Salesforce Ticket Pool</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:13px;color:#181818;background:#eef1f6}
a{color:#0b5cab;text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}
.mockbar{background:#fe9339;color:#fff;text-align:center;font-size:11px;padding:2px;letter-spacing:.3px}
.header{background:#fff;height:50px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #d8dde6;gap:16px}
.logo{width:34px;height:24px;border-radius:12px;background:#0176d3;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:12px}
.search{flex:1;max-width:560px;margin:0 auto}.search input{width:100%;padding:7px 12px;border:1px solid #c9c9c9;border-radius:4px}
.user{display:flex;align-items:center;gap:10px;color:#444;white-space:nowrap}.avatar{width:30px;height:30px;border-radius:50%;background:#7f8de1;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600}
.nav{background:#fff;height:40px;display:flex;align-items:stretch;padding:0 16px;border-bottom:3px solid #0176d3;overflow-x:auto}
.appname{font-size:17px;padding-right:24px;display:flex;align-items:center}
.nav a.tab{display:flex;align-items:center;padding:0 12px;color:#181818;border-bottom:3px solid transparent;margin-bottom:-3px;white-space:nowrap}
.nav a.tab.active{border-bottom-color:#0176d3;font-weight:600;background:#f3f6fb}.nav a.tab:hover{text-decoration:none;background:#f3f3f3}
.page{padding:12px}
.card{background:#fff;border:1px solid #dddbda;border-radius:4px;box-shadow:0 2px 2px rgba(0,0,0,.1)}
.pagehead{padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #dddbda;background:#f3f3f3;border-radius:4px 4px 0 0;flex-wrap:wrap}
.icon{width:32px;height:32px;border-radius:4px;background:#f2cf5b;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.eyebrow{font-size:12px;color:#444}.title{font-size:18px;font-weight:700}
.meta{font-size:12px;color:#444;padding:6px 16px}
.btn{display:inline-block;border:1px solid #c9c9c9;background:#fff;color:#0176d3;padding:5px 14px;border-radius:4px;cursor:pointer;font-size:13px;font-family:inherit}
.btn.brand{background:#0176d3;border-color:#0176d3;color:#fff}.btn:hover{text-decoration:none;background:#f3f3f3}.btn.brand:hover{background:#014486}
.right{margin-left:auto;display:flex;gap:6px;align-items:center}
select,input[type=text],input[type=password],textarea{padding:6px 8px;border:1px solid #c9c9c9;border-radius:4px;font:inherit}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:600;font-size:12px;color:#444;background:#fafaf9;padding:8px;border-bottom:1px solid #dddbda;white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid #e5e5e5}tr:hover td{background:#f3f6fb}
.col-description{max-width:380px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#444}
.pill{display:inline-block;padding:1px 8px;border-radius:12px;font-size:11px;background:#ecebea}
.p-Critical{background:#ba0517;color:#fff}.p-High{background:#fe9339;color:#fff}.p-Medium{background:#fcc003}.p-Low{background:#c9e7d0}
.layout{display:grid;grid-template-columns:220px 1fr;gap:12px}
@media (max-width:760px){.layout{grid-template-columns:1fr}.grid2{grid-template-columns:1fr!important}.search{display:none}}
.side h4{margin:0;padding:10px 12px;border-bottom:1px solid #dddbda;font-size:13px}
.side a{display:flex;justify-content:space-between;padding:6px 12px;color:#181818}.side a.sel{background:#e8f1fc;font-weight:600}
.badge{background:#ecebea;border-radius:10px;padding:0 7px;font-size:11px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 32px;padding:16px}
.field{border-bottom:1px solid #dddbda;padding:6px 0}.field label{display:block;font-size:12px;color:#444;margin-bottom:2px}
.path{display:flex;margin:12px 16px}.path span{flex:1;text-align:center;padding:6px;background:#ecebea;margin-right:4px;clip-path:polygon(0 0,95% 0,100% 50%,95% 100%,0 100%,5% 50%)}
.path span.done{background:#2e844a;color:#fff}.path span.cur{background:#014486;color:#fff}
code,pre{font-family:Menlo,Consolas,monospace;font-size:12px;background:#f3f3f3;padding:2px 4px;border-radius:3px}pre{padding:10px;overflow:auto;max-height:520px}
.login-bg{min-height:calc(100vh - 18px);background:#f3f2f2;display:flex;flex-direction:column;align-items:center;padding:60px 12px 0}
.login-logo{font-size:30px;font-weight:300;color:#0176d3;margin-bottom:20px}.login-logo b{font-weight:700}
.login-box{background:#fff;border:1px solid #d8dde6;border-radius:4px;padding:20px 30px;width:100%;max-width:380px}
.login-box label{display:block;font-size:12px;color:#54698d;margin:12px 0 6px}
.login-box input{width:100%;padding:12px}
.login-box .btn{width:100%;padding:12px;margin-top:20px;font-size:14px}
.err{color:#c23934;font-size:12px;border:1px solid #c23934;padding:8px;border-radius:4px;margin-top:10px;background:#fdecea}
.hint{width:100%;max-width:380px;margin-top:16px;font-size:12px;color:#54698d;background:#fff;border:1px dashed #c9c9c9;padding:10px 14px;border-radius:4px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2e844a;color:#fff;padding:10px 18px;border-radius:4px;display:none}
.hidden{display:none!important}

/* ---- Salesforce-style record page ---- */
.sf-highlights{padding:12px 16px 14px;margin-bottom:12px}
.hl-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hl-icon{width:36px;height:36px;border-radius:4px;background:#f2cf5b;display:flex;align-items:center;justify-content:center}
.hl-title h1{margin:0;font-size:18px;font-weight:700;line-height:1.2}
.btn-group{gap:0!important}.btn-group .btn{border-radius:0;margin-left:-1px}.btn-group .btn:first-child{border-radius:4px 0 0 4px}.btn-group .btn:last-child{border-radius:0 4px 4px 0}
.icon-btn{padding:5px 8px}
.hl-subject{font-size:15px;font-weight:600;margin:10px 0 2px;color:#181818}
.hl-fields{display:flex;gap:36px;flex-wrap:wrap;margin-top:10px}
.hl-fields>div{display:flex;flex-direction:column;gap:2px}
.sf-label{font-size:12px;color:#444}
.sf-pathcard{display:flex;align-items:center;gap:12px;padding:10px 14px;margin-bottom:12px}
.sf-path{display:flex;flex:1}
.sf-path span{flex:1;text-align:center;padding:7px 4px;background:#ecebea;margin-right:3px;cursor:pointer;font-size:13px;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%,10px 50%)}
.sf-path span:first-child{border-radius:16px 0 0 16px;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%)}
.sf-path span:last-child{border-radius:0 16px 16px 0;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,10px 50%)}
.sf-path span.done{background:#3ba755;color:#fff}.sf-path span.cur{background:#032d60;color:#fff;font-weight:600}
.sf-path span:not(.cur):not(.done):hover{background:#dddbda}
.sf-record{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:12px}
@media (max-width:900px){.sf-record{grid-template-columns:1fr}}
.sf-tabs{display:flex;gap:20px;padding:0 16px;border-bottom:1px solid #dddbda}
.sf-tabs a{padding:12px 2px;color:#181818;border-bottom:3px solid transparent;margin-bottom:-1px}
.sf-tabs a.on{border-bottom-color:#0176d3;font-weight:600}.sf-tabs a:hover{text-decoration:none;color:#0176d3}
.sf-section{padding:4px 16px 8px}
.sf-sechead{display:flex;align-items:center;gap:6px;background:#f3f3f3;border-radius:4px;padding:6px 8px;font-size:14px;margin:10px 0 4px}
.sf-section.focus .sf-sechead{background:#e8f1fc;color:#014486;font-weight:600}
.sf-grid{display:grid;grid-template-columns:1fr 1fr;column-gap:32px}
@media (max-width:760px){.sf-grid{grid-template-columns:1fr}}
.sf-field{padding:6px 4px 4px;border-bottom:1px solid #dddbda}
.sf-field.full{grid-column:1/-1}
.sf-val{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;min-height:20px;margin-top:2px}
.sf-val .pen{visibility:hidden;cursor:pointer}.sf-field:hover .pen{visibility:visible}
.sf-field.edit{border-bottom:none}.sf-field.edit input,.sf-field.edit select{width:100%}
.desc{white-space:pre-wrap;line-height:1.55}
.sf-section.focus .sf-field.full .desc{display:block;font-size:14px;background:#fafaf9;border-left:3px solid #0176d3;padding:8px 10px;border-radius:2px}
.sf-footer{position:sticky;bottom:0;background:#f3f3f3;border-top:1px solid #dddbda;padding:10px;text-align:center;display:flex;gap:8px;justify-content:center}
.sf-feed{padding:14px 16px}
.post{display:flex;gap:8px;margin-bottom:14px}.post textarea{flex:1}
.feed-item{display:flex;gap:10px;padding:10px 0;border-top:1px solid #e5e5e5}
.avatar.sm{width:28px;height:28px;font-size:12px;flex:none}
.muted{color:#706e6b;font-size:12px}
.sf-side{display:flex;flex-direction:column;gap:12px}
.rel-head{display:flex;align-items:center;gap:8px;padding:10px 12px;font-weight:700;font-size:14px;border-bottom:1px solid #dddbda;background:#f3f3f3;border-radius:4px 4px 0 0}
.rel-icon{width:24px;height:24px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px}
.rel-body{padding:10px 12px;line-height:1.6}.rel-body .sf-label{margin-top:4px}
.dropzone{border:1px dashed #c9c9c9;border-radius:4px;padding:14px;text-align:center;color:#0176d3}
td.col-created{white-space:nowrap}
th.rn,td.rn{width:28px;color:#706e6b;text-align:right}th.cb,td.cb{width:28px}
</style></head>
<body>
<div class="mockbar">MOCKFORCE — test environment for playbook testing · fake data only</div>

<!-- LOGIN -->
<div id="loginView" class="login-bg">
  <div class="login-logo"><b>Mock</b>Force</div>
  <form class="login-box" id="loginForm" autocomplete="off">
    <label for="username">Username</label>
    <input id="username" name="username" type="text">
    <label for="password">Password</label>
    <input id="password" name="password" type="password">
    <div class="err hidden" id="error">Please check your username and password. If you still can't log in, contact your administrator.</div>
    <button class="btn brand" id="Login" type="submit">Log In</button>
  </form>
</div>

<!-- APP -->
<div id="appView" class="hidden">
  <div class="header">
    <div class="logo">MF</div>
    <form class="search" id="searchForm"><input type="text" id="globalSearch" placeholder="Search Cases..."></form>
    <div class="user"><span id="userName"></span><div class="avatar" id="avatar">?</div><a id="logout">Log Out</a></div>
  </div>
  <div class="nav">
    <div class="appname">Service</div>
    <a class="tab" data-nav="pool" href="#pool">Cases</a>
    <a class="tab" data-nav="new" href="#new">New Case</a>
    <a class="tab" data-nav="export" href="#export">Data Export (JSON)</a>
    <a class="tab" data-nav="setup" href="#setup">Setup</a>
  </div>
  <div class="page" id="page"></div>
</div>
<div class="toast" id="toast"></div>

<script>
// ---------------- seed data ----------------
// Ticket templates. Technology is NOT stored anywhere: it must be inferred from subject/description.
const TPL = [
 ["Order service throwing errors after deploy","After last night's release the order service started failing. Logs show java.lang.NullPointerException at com.acme.order.OrderMapper.map(OrderMapper.java:88). Spring Boot 3.1 on Tomcat. Customers cannot submit orders."],
 ["Production node keeps restarting","The billing node restarts every 30-40 minutes. GC logs show the JVM heap at 98% followed by java.lang.OutOfMemoryError: Java heap space. Xmx is set to 4g."],
 ["Message backlog growing on payments topic","Consumer lag on the payments Kafka topic keeps growing. Our @KafkaListener in the payments microservice (Maven build, JDK 17) seems to stall after a rebalance."],
 ["Nightly data pipeline stuck","The nightly ETL in Airflow has been in 'queued' state since 2 AM. The DAG file imports pandas and the task fails with ModuleNotFoundError in the worker's virtualenv after pip upgrade."],
 ["Login endpoint returning 500","The /login route of our internal portal returns HTTP 500. Traceback (most recent call last): File \"app.py\", line 42, in login ... KeyError: 'user_id'. App runs on Flask with gunicorn."],
 ["Database migration failing on release","manage.py migrate fails with django.db.utils.IntegrityError on the accounts app. Blocking today's release of the customer portal."],
 ["Web application down for HR portal","HR portal shows 'Service Unavailable'. IIS application pool keeps stopping, Event Viewer shows w3wp.exe crash with System.StackOverflowException."],
 ["Deadlocks in reporting module","Reporting screens time out. SQL profiler shows deadlocks on queries generated by Entity Framework Core from our ASP.NET MVC app. Started after adding a new DbContext."],
 ["Build broken after framework upgrade","After upgrading the solution from net6.0 to net8.0 the build fails in Visual Studio with CS0246 errors in three C# projects. NuGet restore completed fine."],
 ["Invoices not reaching customer system","Outbound invoice IDocs are stuck in status 51 in WE02. Message: 'Application document not posted'. Started after the transport moved to PRD yesterday."],
 ["Sales order creation very slow","Creating sales orders in VA01 takes over 2 minutes and the BAPI_SALESORDER_CREATEFROMDAT2 call from our middleware times out. Basis team sees long dialog response times."],
 ["Launchpad tiles not loading","Users report blank tiles in the Fiori launchpad after the support pack. Gateway error log /IWFND/ERROR_LOG shows 403 on the OData service."],
 ["Opportunity update errors for sales team","Sales reps get 'Apex CPU time limit exceeded' when saving an Opportunity. A record-triggered Flow and two Apex triggers fire on update."],
 ["Integration user cannot connect","Our middleware integration user is locked out of the org and the Connected App returns invalid_grant. Need the user unlocked and security token reset."],
 ["Record page very slow to open","Account record page in Lightning Experience takes 15 seconds to load. Page has 12 LWC components and several related lists."],
 ["Server unreachable since morning","Our app server i-0a12bc34 in us-east-1 is not reachable over SSH. EC2 console shows the instance status check failed. Security group unchanged."],
 ["File uploads failing with access denied","Uploads to the documents bucket fail with AccessDenied. The IAM role attached to the app was rotated last week; bucket policy references the old role ARN in S3."],
 ["Database storage nearly full","CloudWatch alarm: FreeStorageSpace below 5% on our RDS PostgreSQL instance prod-db-01. Storage autoscaling is disabled."],
 ["Containers crashing in cluster","Pods in the checkout namespace on AKS are in CrashLoopBackOff. kubectl describe shows OOMKilled. Images are pulled from our Azure Container Registry."],
 ["Single sign-on loop for employees","Employees get stuck in a redirect loop when signing in through Azure AD (Entra ID). Conditional access policy was changed on Friday."],
 ["Deployment failing for function app","Release pipeline in Azure DevOps fails deploying the Function App: 'Zip deployment failed, 409 Conflict'. Storage account connection string recently rotated."],
 ["Long running report error","Month-end report fails with ORA-01555: snapshot too old: rollback segment number with name \"_SYSSMU5$\" too small. Report queries GL_BALANCES."],
 ["Storage space alert on production DB","Alert from OEM: tablespace USERS is 95% full on PRODDB. Autoextend is off on datafile users01.dbf."],
 ["Standby database lagging","Data Guard apply lag on the standby has increased to 3 hours. DGMGRL shows transport lag as well; archive logs are not shipping."],
 ["Branch office cannot reach HQ","The site-to-site VPN tunnel to the Pune branch is down. IKE phase 1 fails on the Fortinet firewall after the ISP changed their public IP."],
 ["Intermittent slowness across office","Users on floor 3 see packet loss and slow file shares. Core switch interface Gi1/0/24 shows CRC errors and the uplink is flapping."],
 ["Websites intermittently not resolving","Internal sites like intranet.local fail to resolve randomly. nslookup times out against the secondary DNS server 10.0.0.12."],
 ["Tickets not getting assigned automatically","Incidents created from email are no longer auto-assigned. Assignment rules in the ServiceNow instance stopped working after the Washington DC upgrade."],
 ["Discovery not running","MID server status shows Down in the instance and Discovery schedules are failing. The MID server host was patched yesterday."],
 ["Approval stuck on request","Catalog item request RITM0012345 is stuck in 'Requested' state. The approval workflow never generates the approval record."],
 ["Laptop password reset needed","User forgot their laptop password after returning from leave and is locked out. Please help reset it."],
 ["New joiner access request","Please create an email ID and building access card for a new joiner starting Monday in the finance team."],
 ["Printer not working on 2nd floor","The shared printer near the cafeteria shows paper jam even though there is no paper stuck."],
 ["Application is slow","Customer says the system has been very slow since yesterday. No further details provided."],
];

const ACCTS=["Acme Corp","Globex","Initech","Umbrella Health","Stark Industries","Wayne Enterprises","Hooli","Soylent Foods","Wonka Retail","Cyberdyne"];
const PEOPLE=["Priya Sharma","John Miller","Arjun Rao","Emily Chen","Ravi Kumar","Sara Lopez","David Kim","Ananya Iyer","Tom Becker","Lakshmi Nair"];
const PRI=["Low","Medium","High","Critical"], ORIG=["Email","Web","Phone","Portal"], STEPS=["New","Working","Escalated","Closed"];
const USERS={"meghana@themeridian.test":{pw:"Test@1234",name:"Meghana"}};

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pick=(r,a)=>a[Math.floor(r()*a.length)];
const sfDate=d=>d.toISOString().replace("Z","+0000");
function seed(){
  const r=rng(42), now=Date.now(), out=[];
  for(let i=1;i<=60;i++){
    const tp=TPL[(i*7)%TPL.length], created=new Date(now-(Math.floor(r()*240)+1)*3600e3-Math.floor(r()*60)*60e3);
    const inPool=r()<0.7, w=r()*10, pri=w<3?"Low":w<7?"Medium":w<9?"High":"Critical";
    out.push({Id:"5005g00000"+String(i).padStart(5,"0")+"AAA",CaseNumber:String(1000+i).padStart(8,"0"),
      Subject:tp[0],Description:tp[1],
      Status:inPool?"New":pick(r,["Working","Escalated","Closed"]),Priority:pri,Origin:pick(r,ORIG),
      Account_Name__c:pick(r,ACCTS),Contact_Name__c:pick(r,PEOPLE),
      Owner_Name__c:inPool?"Ticket Pool":pick(r,PEOPLE),OwnerType:inPool?"Queue":"User",
      CreatedDate:sfDate(created),LastModifiedDate:sfDate(created)});
  }
  return out;
}
let CASES=seed(), nextNum=61, user=null, search="";
// Session is kept in a cookie (mf_session) so cookie-based browser automation stays logged in between runs.
const SESSION_COOKIE="mf_session", SESSION_DAYS=7;
function setSession(u){try{const sec=location.protocol==="https:"?"; Secure":"";
  document.cookie=SESSION_COOKIE+"="+encodeURIComponent(u)+"; path=/; max-age="+(SESSION_DAYS*86400)+"; SameSite=Lax"+sec}catch(e){}}
function getSession(){try{const m=document.cookie.match(new RegExp("(?:^|; )"+SESSION_COOKIE+"=([^;]*)"));return m?decodeURIComponent(m[1]):null}catch(e){return null}}
function clearSession(){try{document.cookie=SESSION_COOKIE+"=; path=/; max-age=0; SameSite=Lax"}catch(e){}}
{const s=getSession();if(s&&USERS[s])user=s}

// ---------------- helpers ----------------
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const inPool=c=>c.Owner_Name__c==="Ticket Pool"&&c.Status==="New";
const VIEWS={pool:["Ticket Pool (Unassigned)",inPool],open:["All Open Cases",c=>c.Status!=="Closed"],all:["All Cases",()=>true],closed:["Closed Cases",c=>c.Status==="Closed"]};
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",1800)}

// ---------------- auth ----------------
$("loginForm").addEventListener("submit",e=>{
  e.preventDefault();
  const u=$("username").value.trim(),p=$("password").value;
  if(USERS[u]&&USERS[u].pw===p){user=u;setSession(u);
    $("error").classList.add("hidden");if(!location.hash||location.hash==="#login")location.hash="pool";render();}
  else $("error").classList.remove("hidden");
});
$("logout").onclick=()=>{user=null;clearSession();location.hash="login";render()};
$("searchForm").addEventListener("submit",e=>{e.preventDefault();search=$("globalSearch").value.trim().toLowerCase();keepSearch=location.hash!=="#all";location.hash="all";render()});

// ---------------- views ----------------
function listView(view){
  const [label,pred]=VIEWS[view];
  let rows=CASES.filter(pred);
  if(search)rows=rows.filter(c=>(c.Subject+c.CaseNumber+c.Account_Name__c).toLowerCase().includes(search));
  rows.sort((a,b)=>b.CreatedDate.localeCompare(a.CreatedDate));
  return `<div class="layout">
  <div class="card side"><h4>List Views</h4>
    ${Object.entries(VIEWS).map(([k,v])=>`<a href="#${k}" class="${k===view?"sel":""}">${v[0]}</a>`).join("")}
  </div>
  <div class="card">
    <div class="pagehead"><div class="icon">C</div>
      <div><div class="eyebrow">Cases</div><div class="title" id="listTitle">${label}${search?` · “${esc(search)}”`:""}</div></div>
      <div class="right"><a class="btn brand" href="#new">New</a><button class="btn" id="resetBtn">Reset Data</button></div></div>
    <div class="meta"><span id="itemCount">${rows.length}</span> items · Sorted by Date/Time Opened</div>
    <div class="tablewrap"><table id="caseTable"><thead><tr><th class="rn"></th><th class="cb"><input type="checkbox"></th><th>Case Number ▾</th><th>Subject</th><th>Description</th><th>Priority</th><th>Status</th><th>Account Name</th><th>Case Owner</th><th>Date/Time Opened</th></tr></thead><tbody>
    ${rows.map((c,i)=>`<tr class="case-row" data-id="${c.Id}" data-case-number="${c.CaseNumber}" data-priority="${c.Priority}" data-status="${c.Status}">
      <td class="rn">${i+1}</td><td class="cb"><input type="checkbox"></td><td class="col-number"><a href="#case-${c.CaseNumber}">${c.CaseNumber}</a></td><td class="col-subject">${esc(c.Subject)}</td>
      <td class="col-description" title="${esc(c.Description)}">${esc(c.Description)}</td><td class="col-priority"><span class="pill p-${c.Priority}">${c.Priority}</span></td>
      <td class="col-status">${c.Status}</td><td class="col-account">${esc(c.Account_Name__c)}</td><td class="col-owner">${esc(c.Owner_Name__c)}</td>
      <td class="col-created">${c.CreatedDate.slice(0,16).replace("T"," ")}</td></tr>`).join("")||`<tr><td colspan="10" style="text-align:center;padding:30px;color:#706e6b">No items to display.</td></tr>`}
    </tbody></table></div>
  </div></div>`;
}
let editMode=false, caseTab="details", FEED={};
const fmt=d=>{const x=new Date(d.replace("+0000","Z"));return x.toLocaleDateString("en-GB",{day:"2-digit",month:"2-digit",year:"numeric"})+", "+x.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})};
const email=n=>n?n.toLowerCase().replace(/\s+/g,".")+"@example.com":"";
const SVG={
 case:'<svg viewBox="0 0 24 24" width="22" height="22" fill="#fff"><path d="M9 4h6a2 2 0 0 1 2 2v1h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h3V6a2 2 0 0 1 2-2zm0 3h6V6H9v1z"/></svg>',
 contact:'<svg viewBox="0 0 24 24" width="16" height="16" fill="#fff"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6z"/></svg>',
 pencil:'<svg viewBox="0 0 24 24" width="12" height="12" fill="#939393"><path d="M3 17.2V21h3.8l11-11-3.8-3.8-11 11zM20.7 7a1 1 0 0 0 0-1.4l-2.3-2.3a1 1 0 0 0-1.4 0l-1.8 1.8 3.8 3.8L20.7 7z"/></svg>',
 chev:'<svg viewBox="0 0 24 24" width="14" height="14" fill="#444"><path d="M7 10l5 5 5-5z"/></svg>'};
function fieldRO(label,val,id,full){return `<div class="sf-field${full?" full":""}"><span class="sf-label">${label}</span><div class="sf-val"><span${id?` id="${id}"`:""}>${val||"&nbsp;"}</span>${editMode?"":`<span class="pen">${SVG.pencil}</span>`}</div></div>`}
function fieldEd(label,html,full){return `<div class="sf-field edit${full?" full":""}"><span class="sf-label">${label}</span><div>${html}</div></div>`}
function caseView(num){
  const c=CASES.find(x=>x.CaseNumber===num);
  if(!c)return `<div class="card" style="padding:30px">Case not found. <a href="#pool">Back to list</a></div>`;
  const si=STEPS.indexOf(c.Status);
  const opt=(arr,v)=>arr.map(a=>`<option ${a===v?"selected":""}>${esc(a)}</option>`).join("");
  const feed=(FEED[c.CaseNumber]||[]);
  const sel=(n,arr)=>`<select name="${n}">${opt(arr,c[n])}</select>`;
  const inp=n=>`<input type="text" name="${n}" value="${esc(c[n])}">`;
  const F=editMode?
   {owner:fieldEd("Case Owner",inp("Owner_Name__c")),status:fieldEd("Status",sel("Status",STEPS)),pri:fieldEd("Priority",sel("Priority",PRI)),
    origin:fieldEd("Case Origin",sel("Origin",ORIG)),acct:fieldEd("Account Name",inp("Account_Name__c")),contact:fieldEd("Contact Name",inp("Contact_Name__c")),
    subj:fieldEd("Subject",`<input type="text" name="Subject" value="${esc(c.Subject)}" style="width:100%">`,true),
    desc:fieldEd("Description",`<textarea name="Description" rows="5" style="width:100%">${esc(c.Description)}</textarea>`,true)}
  :{owner:fieldRO("Case Owner",`<a>${esc(c.Owner_Name__c)}</a>`,"f-Owner"),status:fieldRO("Status",c.Status,"f-Status"),pri:fieldRO("Priority",c.Priority,"f-Priority"),
    origin:fieldRO("Case Origin",c.Origin,"f-Origin"),acct:fieldRO("Account Name",`<a>${esc(c.Account_Name__c)}</a>`,"f-Account"),contact:fieldRO("Contact Name",`<a>${esc(c.Contact_Name__c)}</a>`,"f-Contact"),
    subj:fieldRO("Subject",esc(c.Subject),"f-Subject",true),desc:fieldRO("Description",`<span class="desc">${esc(c.Description)}</span>`,"f-Description",true)};
  return `
  <div class="sf-highlights card">
    <div class="hl-top">
      <div class="hl-icon">${SVG.case}</div>
      <div class="hl-title"><div class="eyebrow">Case</div><h1 id="f-CaseNumber">${c.CaseNumber}</h1></div>
      <div class="right btn-group">
        <button class="btn" id="followBtn">+ Follow</button>
        <button class="btn" id="editBtn">Edit</button>
        <button class="btn" id="acceptBtn" title="Assign this case to me">Accept</button>
        <button class="btn" id="closeBtn">Close Case</button>
        <button class="btn icon-btn">${SVG.chev}</button>
      </div>
    </div>
    <div class="hl-subject">${esc(c.Subject)}</div>
    <div class="hl-fields">
      <div><span class="sf-label">Priority</span><span class="pill p-${c.Priority}">${c.Priority}</span></div>
      <div><span class="sf-label">Status</span>${c.Status}</div>
      <div><span class="sf-label">Case Number</span>${c.CaseNumber}</div>
      <div><span class="sf-label">Case Origin</span>${c.Origin}</div>
      <div><span class="sf-label">Case Owner</span><a>${esc(c.Owner_Name__c)}</a></div>
      <div><span class="sf-label">Account Name</span><a>${esc(c.Account_Name__c)}</a></div>
    </div>
  </div>

  <div class="card sf-pathcard">
    <div class="sf-path">${STEPS.map((s,i)=>`<span class="${i===si?"cur":i<si?"done":""}" data-step="${s}">${i<si?"✓ ":""}${s}</span>`).join("")}</div>
    ${si<STEPS.length-1?`<button class="btn brand" id="nextStep">✓ Mark Status as Complete</button>`:""}
  </div>

  <div class="sf-record">
    <div class="card sf-main">
      <div class="sf-tabs"><a data-tab="details" class="${caseTab==="details"?"on":""}">Details</a><a data-tab="feed" class="${caseTab==="feed"?"on":""}">Feed</a></div>
      ${caseTab==="details"?`
      <form id="editForm" data-number="${c.CaseNumber}">
        <div class="sf-section"><div class="sf-sechead">${SVG.chev} Case Information</div>
          <div class="sf-grid">${F.owner}${fieldRO("Case Number",c.CaseNumber)}${F.status}${F.contact}${F.pri}${F.acct}${F.origin}${fieldRO("Record Id",`<code>${c.Id}</code>`,"f-Id")}</div></div>
        <div class="sf-section focus"><div class="sf-sechead">${SVG.chev} Description Information</div>
          <div class="sf-grid">${F.subj}${F.desc}</div></div>
        <div class="sf-section"><div class="sf-sechead">${SVG.chev} Web Information</div>
          <div class="sf-grid">${fieldRO("Web Email",email(c.Contact_Name__c))}${fieldRO("Web Company",esc(c.Account_Name__c))}${fieldRO("Web Name",esc(c.Contact_Name__c))}${fieldRO("Web Phone","+91 80 4000 "+c.CaseNumber.slice(-4))}</div></div>
        <div class="sf-section"><div class="sf-sechead">${SVG.chev} System Information</div>
          <div class="sf-grid">${fieldRO("Created By",`<a>${esc(c.Contact_Name__c||"Web-to-Case")}</a>, ${fmt(c.CreatedDate)}`,"f-Created")}${fieldRO("Last Modified By",`<a>${esc(USERS[user].name)}</a>, ${fmt(c.LastModifiedDate)}`)}</div></div>
        ${editMode?`<div class="sf-footer"><button type="button" class="btn" id="cancelBtn">Cancel</button><button class="btn brand" id="saveBtn">Save</button></div>`:""}
      </form>`:`
      <div class="sf-feed">
        <div class="post"><textarea id="postText" rows="2" placeholder="Share an update..."></textarea><button class="btn brand" id="postBtn">Share</button></div>
        ${feed.slice().reverse().map(f=>`<div class="feed-item"><div class="avatar sm">${esc(f.who[0])}</div><div><b>${esc(f.who)}</b> <span class="muted">${fmt(f.at)}</span><div>${esc(f.text)}</div></div></div>`).join("")}
        <div class="feed-item"><div class="avatar sm" style="background:#f2cf5b">C</div><div><b>${esc(c.Contact_Name__c||"Customer")}</b> created this case via ${c.Origin}. <span class="muted">${fmt(c.CreatedDate)}</span><div class="desc">${esc(c.Description)}</div></div></div>
      </div>`}
    </div>

    <div class="sf-side">
      <div class="card rel"><div class="rel-head"><span class="rel-icon" style="background:#a094ed">${SVG.contact}</span>Contact Details</div>
        <div class="rel-body"><div class="sf-label">Name</div><a>${esc(c.Contact_Name__c)}</a>
          <div class="sf-label">Email</div><a>${email(c.Contact_Name__c)}</a>
          <div class="sf-label">Account</div><a>${esc(c.Account_Name__c)}</a></div></div>
      <div class="card rel"><div class="rel-head"><span class="rel-icon" style="background:#3ba755">✉</span>Emails (1)</div>
        <div class="rel-body"><a>${esc(c.Subject)}</a><div class="muted">From: ${email(c.Contact_Name__c)} · ${fmt(c.CreatedDate)}</div></div></div>
      <div class="card rel"><div class="rel-head"><span class="rel-icon" style="background:#f49756">💬</span>Case Comments (${feed.length})</div>
        <div class="rel-body">${feed.length?feed.slice(-3).reverse().map(f=>`<div>${esc(f.text)}</div>`).join(""):'<span class="muted">No comments yet</span>'}</div></div>
      <div class="card rel"><div class="rel-head"><span class="rel-icon" style="background:#baac93">📎</span>Files (0)</div>
        <div class="rel-body"><div class="dropzone">Upload Files or drop files</div></div></div>
    </div>
  </div>`;
}
function newView(){
  return `<div class="card" style="max-width:760px;margin:0 auto"><div class="pagehead"><div class="icon">C</div><div class="title">New Case</div></div>
  <form id="newForm"><div class="grid2">
    <div class="field" style="grid-column:1/-1"><label>Subject</label><input type="text" name="Subject" required style="width:100%"></div>
    <div class="field"><label>Priority</label><select name="Priority"><option>Low</option><option selected>Medium</option><option>High</option><option>Critical</option></select></div>
    <div class="field"><label>Account Name</label><input type="text" name="Account_Name__c" value="Acme Corp"></div>
    <div class="field"><label>Contact Name</label><input type="text" name="Contact_Name__c"></div>
    <div class="field"><label>Case Origin</label><select name="Origin">${ORIG.map(o=>`<option>${o}</option>`).join("")}</select></div>
    <div class="field"><label>Case Owner</label><input type="text" name="Owner_Name__c" value="Ticket Pool"></div>
    <div class="field" style="grid-column:1/-1"><label>Description</label><textarea name="Description" rows="4" style="width:100%"></textarea></div>
  </div><div style="padding:0 16px 16px;text-align:center"><a class="btn" href="#pool">Cancel</a> <button class="btn brand">Save</button></div></form></div>`;
}
function exportView(){
  const pool=CASES.filter(inPool).map(c=>({attributes:{type:"Case"},...c}));
  const json=JSON.stringify({totalSize:pool.length,done:true,records:pool},null,2);
  return `<div class="card"><div class="pagehead"><div class="icon" style="background:#3ba755">{}</div>
    <div><div class="eyebrow">Data Export</div><div class="title">Ticket Pool as JSON (Salesforce query format)</div></div>
    <div class="right"><button class="btn brand" id="copyJson">Copy JSON</button></div></div>
    <div class="meta">Same shape as <code>SELECT ... FROM Case WHERE Status='New' AND Owner_Name__c='Ticket Pool'</code> — read <code>#jsonData</code> from your playbook.</div>
    <pre id="jsonData">${esc(json)}</pre></div>`;
}
function setupView(){
  return `<div class="card" style="max-width:900px;margin:0 auto"><div class="pagehead"><div class="icon" style="background:#7f8de1">⚙</div>
    <div><div class="eyebrow">Setup</div><div class="title">Test environment info</div></div></div>
  <div style="padding:16px;line-height:1.8">
    <h3 style="margin-top:0">Login</h3>
    Username <code>meghana@themeridian.test</code> · Password <code>Test@1234</code>
    <h3>Page links (for your playbook)</h3>
    Session: cookie <code>mf_session</code> (path /, 7 days) — reused on later visits; Log Out clears it.<br><code>#login</code> login page · <code>#pool</code> unassigned ticket pool · <code>#all</code> all cases · <code>#case-00001027</code> one ticket (full description in <code>#f-Description</code>) · <code>#export</code> pool as JSON
    <h3>Element selectors</h3>
    Login: <code>#username</code>, <code>#password</code>, <code>#Login</code>, error <code>#error</code><br>
    Ticket table: <code>#caseTable tr.case-row</code> with attributes <code>data-id</code>, <code>data-case-number</code>, <code>data-priority</code>, <code>data-status</code><br>
    Cells: <code>.col-number .col-subject .col-description .col-priority .col-status .col-account .col-owner .col-created</code><br>
    Item count: <code>#itemCount</code> · JSON: <code>#jsonData</code>
    <h3>Triage</h3>Tickets have <b>no technology field</b>. Your playbook must work out the technology from the Subject/Description. Some tickets have no technical clues at all (to test an "Unclassified" path).
    <h3>Data</h3>
    ${CASES.length} cases total, ${CASES.filter(inPool).length} in pool. Changes stay until the page is reloaded; <button class="btn" id="resetBtn">Reset Data</button>
  </div></div>`;
}

function render(){
  const loggedIn=!!user;
  $("loginView").classList.toggle("hidden",loggedIn);
  $("appView").classList.toggle("hidden",!loggedIn);
  if(!loggedIn){$("username").focus();return}
  $("userName").textContent=USERS[user].name;$("avatar").textContent=USERS[user].name[0];
  const h=(location.hash||"#pool").slice(1);
  let html, nav="pool";
  if(VIEWS[h]){html=listView(h)}
  else if(h.startsWith("case-")){html=caseView(h.slice(5))}
  else if(h==="new"){html=newView();nav="new"}
  else if(h==="export"){html=exportView();nav="export"}
  else if(h==="setup"){html=setupView();nav="setup"}
  else {html=listView("pool")}
  document.querySelectorAll(".nav a.tab").forEach(a=>a.classList.toggle("active",a.dataset.nav===nav));
  $("page").innerHTML=html;
  bind();
}
function bind(){
  document.querySelectorAll("#resetBtn").forEach(b=>b.onclick=()=>{CASES=seed();nextNum=61;search="";toast("Data reset");render()});
  const ef=$("editForm"), num=(location.hash.match(/^#case-(\d+)/)||[])[1], cc=num&&CASES.find(x=>x.CaseNumber===num);
  const touch=c=>{c.OwnerType=c.Owner_Name__c==="Ticket Pool"?"Queue":"User";c.LastModifiedDate=sfDate(new Date())};
  const log=(c,t)=>{(FEED[c.CaseNumber]=FEED[c.CaseNumber]||[]).push({who:USERS[user].name,at:sfDate(new Date()),text:t})};
  if(ef)ef.onsubmit=e=>{e.preventDefault();new FormData(ef).forEach((v,k)=>cc[k]=v);touch(cc);editMode=false;toast("Case \""+cc.CaseNumber+"\" was saved.");render()};
  document.querySelectorAll("[data-tab]").forEach(t=>t.onclick=()=>{caseTab=t.dataset.tab;render()});
  if($("editBtn"))$("editBtn").onclick=()=>{editMode=true;caseTab="details";render()};
  document.querySelectorAll(".sf-val .pen").forEach(p=>p.onclick=()=>{editMode=true;render()});
  if($("cancelBtn"))$("cancelBtn").onclick=()=>{editMode=false;render()};
  if($("closeBtn"))$("closeBtn").onclick=()=>{cc.Status="Closed";touch(cc);log(cc,"Closed the case.");toast("Case closed.");render()};
  if($("acceptBtn"))$("acceptBtn").onclick=()=>{cc.Owner_Name__c=USERS[user].name;if(cc.Status==="New")cc.Status="Working";touch(cc);log(cc,"Accepted the case.");toast("You now own this case.");render()};
  if($("followBtn"))$("followBtn").onclick=e=>{e.target.textContent=e.target.textContent.includes("Following")?"+ Follow":"✓ Following"};
  if($("nextStep"))$("nextStep").onclick=()=>{cc.Status=STEPS[STEPS.indexOf(cc.Status)+1];touch(cc);log(cc,"Changed status to "+cc.Status+".");toast("Status changed successfully.");render()};
  document.querySelectorAll(".sf-path span").forEach(sp=>sp.onclick=()=>{cc.Status=sp.dataset.step;touch(cc);render()});
  if($("postBtn"))$("postBtn").onclick=()=>{const t=$("postText").value.trim();if(t){log(cc,t);render()}};
  const nf=$("newForm");if(nf)nf.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(nf));const n=nextNum++;
    const c={Id:"5005g00000"+String(n).padStart(5,"0")+"AAA",CaseNumber:String(1000+n).padStart(8,"0"),Status:"New",
      OwnerType:d.Owner_Name__c==="Ticket Pool"?"Queue":"User",CreatedDate:sfDate(new Date()),LastModifiedDate:sfDate(new Date()),...d};
    CASES.push(c);toast("Case "+c.CaseNumber+" was created.");location.hash="case-"+c.CaseNumber};
  const cj=$("copyJson");if(cj)cj.onclick=async()=>{try{await navigator.clipboard.writeText($("jsonData").textContent);toast("Copied")}catch(e){toast("Select the text and copy manually")}};
}
let keepSearch=false;
window.addEventListener("hashchange",()=>{editMode=false;caseTab="details";if(!keepSearch)search="";keepSearch=false;render()});
render();
</script>
</body></html>
